services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mapkathi
      POSTGRES_PASSWORD: mapkathi
      POSTGRES_DB: mapkathi
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mapkathi']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mapkathi:mapkathi@db:5432/mapkathi
    env_file:
      - .env
    ports:
      - '3000:3000'

volumes:
  db_data:
