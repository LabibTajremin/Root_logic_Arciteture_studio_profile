name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (includes layer-boundary rule)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit & integration tests
        run: pnpm test

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mapkathi
          POSTGRES_PASSWORD: mapkathi
          POSTGRES_DB: mapkathi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mapkathi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
          MINIO_DEFAULT_BUCKETS: mapkathi-test
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgres://mapkathi:mapkathi@localhost:5432/mapkathi
      # S3 contract runs against MinIO (local + S3 in CI; remote drivers stay flagged).
      RUN_S3_CONTRACT: '1'
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: mapkathi-test
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then echo "minio ready"; exit 0; fi
            sleep 2
          done
          echo "minio did not become ready" && exit 1

      - name: Run migrations
        run: pnpm db:migrate

      - name: Integration tests (incl. S3 contract)
        run: pnpm test:integration

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Build must not require live secrets; config validation is lazy at runtime.
          SKIP_ENV_VALIDATION: '1'

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mapkathi
          POSTGRES_PASSWORD: mapkathi
          POSTGRES_DB: mapkathi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mapkathi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mapkathi:mapkathi@localhost:5432/mapkathi
      AUTH_SECRET: ci-e2e-secret-not-for-production
      APP_URL: http://localhost:3000
      ADMIN_EMAIL: owner@example.com
      ADMIN_PASSWORD: change-this-on-first-login
      ADMIN_NAME: Studio Owner
      DEPLOYMENT_MODE: '1'
      STORAGE_DRIVER: '3'
      LOCAL_STORAGE_DIR: ./uploads
      LICENCE_MODE: '1'
      CACHE_DRIVER: '1'
      MAIL_DRIVER: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate & seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Build
        run: pnpm build

      - name: E2E tests
        run: pnpm exec playwright test --project=chromium
